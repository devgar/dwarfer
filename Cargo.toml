[package]
name = "dwarfer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = false }
axum = { version = "0.6", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
config = { version = "0.13" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.8"
async-trait = { version = "0.1" }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls"], optional = true }
redis = { version = "0.23", optional = true }
validator = { version = "0.16" }
nanoid = { version = "0.4" }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
lazy_static = "1.4"
regex = "1.10"
thiserror = "2.0.18"

[features]
default = ["cli", "repo-sqlite", "auth-api-key", "api-full"]
api-redirect = ["axum"]
api-full = ["axum"]
cli = ["clap"]
repo-file = []
repo-sqlite = ["sqlx", "_db"]
repo-redis = ["redis", "_db"]
repo-postgres = ["sqlx", "_db"]
repo-mongo = ["_db"]
auth-api-key = []
repo-http-remote = []
_db = []
